[project]
name = "adsb-processing"
version = "0.1.0"
description = "ADS-B airport surface trajectory processing and HMM map matching"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas<3",
    "numpy",
    "pyarrow",
    "matplotlib",
    "geopandas>=1.1.4",
    "traffic>=2.13",
    "networkx>=3.6.1",
    "shapely>=2.1",
    "pyproj>=3.7",
    "cartes>=0.8.6",
    "osm2geojson==0.3.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "ipyleaflet>=0.20.0",
]

[dependency-groups]
dev = ["pytest", "ruff", "jupyterlab"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["airport_surface", "airport_workbench", "path_map"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
