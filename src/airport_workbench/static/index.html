<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airport Workbench</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/flight-layout.css">
</head>
<body>
  <header class="topbar panel">
    <div class="brand-mark">AW</div>
    <div class="brand-copy"><strong>Airport Workbench</strong><span id="counts">载入中…</span></div>
    <div class="top-actions">
      <button id="search-toggle" class="text-button"><span>⌕</span> 搜索</button>
      <button id="topology-toggle" class="text-button"><span>◇</span> 拓扑检查</button>
      <button id="flights-toggle" class="text-button"><span>✈</span> 全部航班</button>
      <button id="undo" class="text-button" disabled><span>↶</span> 撤销</button>
      <button id="save" class="save-button"><span>✓</span> 保存</button>
      <button id="finish" class="finish-button hidden"><span>→</span> 完成</button>
    </div>
  </header>
  <nav class="tool-dock panel" aria-label="编辑工具">
    <div class="dock-title">编辑工具</div>
    <button class="tool active" data-mode="inspect"><span>⌖</span><em>查看</em></button>
    <button class="tool" data-mode="split"><span>✂</span><em>补充分割点</em></button>
    <button class="tool" data-mode="restore"><span>⌁</span><em>恢复来源连接</em></button>
    <button class="tool" data-mode="merge"><span>◎</span><em>合并重合节点</em></button>
    <button class="tool" data-mode="snap"><span>↦</span><em>人工吸附到边</em></button>
    <div class="dock-divider"></div>
    <button class="tool danger" data-mode="delete"><span>×</span><em>删除 / 简化</em></button>
  </nav>
  <main class="workspace">
    <nav class="main-tabs" aria-label="航班主视图"><button id="map-tab" class="active">地图</button><button id="observations-tab">观测记录</button></nav>
    <section id="map-view" class="main-view"><div id="map" aria-label="机场工作台地图"></div></section>
    <section id="observations-view" class="main-view observations-view hidden">
      <header class="observations-header"><div><small>当前查看航班</small><h2 id="observations-title">尚未选择航班</h2><p id="observations-summary" class="field-note"></p></div><div><button id="clear-observation-highlight" class="secondary-button" disabled>清除地图定位点</button></div></header>
      <div id="observations-content" class="observations-content"><p class="field-note">请从航班目录点击“详情”。</p></div>
    </section>
    <div class="map-overlay-stack">
      <div class="legend panel">
        <span><i class="dot node-dot"></i>普通节点</span><span><i class="business-legend">P</i>停机位侧</span><span><i class="business-legend runway">R</i>跑道进出</span><span><i class="line edge-line"></i>派生边</span>
        <span><i class="line flight-line"></i>虚线＝原始轨迹</span><span><i class="line path-line"></i>实线＝匹配路径</span>
      </div>
      <div id="layer-control-slot"></div>
    </div>
  </main>
  <section id="search-panel" class="search-panel panel hidden">
    <div class="panel-heading"><div><small>快速定位</small><h2>搜索图要素</h2></div><button class="panel-close" data-close="search-panel">×</button></div>
    <label>节点 ID<div class="input-action"><input id="search-node" placeholder="例如 1055650164"><button id="search-node-button">选中</button></div></label>
    <label>边的两个端点<div class="edge-inputs"><input id="search-edge-u" placeholder="端点 A"><span>—</span><input id="search-edge-v" placeholder="端点 B"><button id="search-edge-button">选中</button></div></label>
  </section>
  <aside id="topology-panel" class="topology-panel panel hidden">
    <div class="panel-heading"><div><small>只辅助人工判断，不自动修改</small><h2>拓扑概览</h2></div><button class="panel-close" data-close="topology-panel">×</button></div>
    <div id="topology-summary" class="metric-grid"></div>
    <div id="topology-details" class="topology-details"></div>
    <div class="topology-actions"><button id="split-validation-toggle" class="secondary-button">开启相邻边辨色</button></div>
    <section class="node-review"><h3>逐点检查</h3><p id="node-review-progress" class="field-note">尚未开始</p><div class="node-review-actions"><button id="node-review-start" class="primary-button">开始</button><button id="node-review-prev" class="secondary-button" disabled>上一个</button><button id="node-review-next" class="secondary-button" disabled>下一个</button><button id="node-review-end" class="secondary-button" disabled>结束</button></div></section>
    <p class="field-note">度为 0/1 的节点只是“值得检查”，不一定是错误。点击上方统计或下方明细可直接在地图定位。</p>
  </aside>
  <aside id="flights-panel" class="flights-panel panel">
    <div id="flight-list-view" class="flight-view">
      <div class="flight-sidebar-header"><div><small>当前工作台加载的数据集</small><h2>全部航班</h2></div></div>
      <div class="flight-query">
        <input id="flight-search" placeholder="搜索航班号或 flight_id，按 Enter 应用">
        <div class="flight-filters"><select id="flight-movement"><option value="">全部进出港</option><option value="arrival">进港</option><option value="departure">离港</option><option value="unknown">未知</option></select><select id="flight-status"><option value="">全部状态</option><option value="unmatched">未匹配</option><option value="queued">排队中</option><option value="matching">匹配中</option><option value="success">成功</option><option value="failed">失败</option><option value="stale">已失效</option></select></div>
        <div class="point-filter"><span>观测点数</span><input id="flight-min-points" type="number" min="0" step="1" inputmode="numeric" aria-label="最小观测点数"><span>～</span><input id="flight-max-points" type="number" min="0" step="1" inputmode="numeric" aria-label="最大观测点数"><button id="apply-point-filter" class="secondary-button">应用</button><button id="reset-point-filter" class="text-button">重置点数</button></div>
        <p id="flight-query-error" class="field-error hidden" role="alert"></p>
      </div>
      <section class="selected-section match-selection"><div class="section-title"><strong id="selection-count">待匹配 0 条</strong><span>可跨页选择</span></div><div class="selection-actions"><button id="select-page" class="secondary-button">选择本页</button><button id="select-filtered" class="secondary-button">选择全部筛选结果</button><button id="clear-match-selection" class="text-button">清空</button></div><p class="field-note">选择可能包含当前列表之外的航班。</p></section>
      <section class="selected-section map-selection"><div class="section-title"><strong id="map-selection-count">地图展示 0/10</strong><span>A～J 固定色槽</span></div><div id="selected-flights" class="selected-flights"></div><div class="selection-actions"><button id="clear-map-selection" class="text-button">清空地图展示</button><button id="fit-selected" class="secondary-button">定位全部</button></div></section>
      <section id="match-progress" class="match-progress hidden"><strong>批量任务</strong><span id="match-progress-text"></span></section>
      <p id="flight-time-note" class="field-note"></p><div id="flight-error" class="warning hidden"></div><div id="overlap-notice" class="warning hidden"></div>
      <div id="flight-list" class="flight-list"></div>
      <div class="flight-sidebar-footer"><div class="pager"><button id="flight-prev" class="secondary-button">上一页</button><span id="flight-page"></span><div class="page-jump"><input id="flight-page-input" type="number" min="1" step="1" inputmode="numeric" aria-label="跳转页码"><button id="flight-page-jump" class="secondary-button">跳转</button></div><button id="flight-next" class="secondary-button">下一页</button></div><p id="flight-page-error" class="field-error hidden" role="alert"></p><div class="footer-actions"><button id="match-selected" class="primary-button" disabled>匹配所选航班</button></div></div>
    </div>
  </aside>
  <aside id="details" class="details panel hidden">
    <button id="back-to-topology" class="secondary-button panel-back hidden">← 返回拓扑检查</button><button id="close-details" class="panel-close" aria-label="关闭">×</button><div id="details-content"></div>
  </aside>
  <div id="status" class="status panel">查看模式 · 点击图层要素查看详情</div>
  <div id="busy" class="busy hidden"><span></span></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
  <script src="/flights-v2.js"></script>
</body>
</html>
